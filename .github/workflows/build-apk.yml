# 手动构建 debug APK：仅在 Actions 页面点击 "Run workflow" 时触发，push/PR 不触发
# 个人自用：产物只上传到 Artifacts，不发布 Release
name: 手动构建 APK

on:
  workflow_dispatch:

jobs:
  build:
    name: 构建 debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 自动开启 Gradle 依赖缓存，二次构建明显提速
      - name: 设置 Gradle（含缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 读取版本号
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          echo "version=$VERSION" >> "$GITHUB_ENV"
          echo "版本号: $VERSION"

      - name: 构建 APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 重命名 APK（应用名 + 版本 + 提交号）
        run: |
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          DST="Ordify-v${{ env.version }}-${GITHUB_SHA::7}-debug.apk"
          mv "$SRC" "$DST"
          echo "apk_name=$DST" >> "$GITHUB_ENV"
          ls -lh "$DST"

      - name: 上传为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.apk_name }}
          path: ${{ env.apk_name }}
          retention-days: 30

      - name: 构建摘要
        run: |
          {
            echo "## 构建完成"
            echo ""
            echo "### 📱 下载方式"
            echo ""
            echo "本页底部 **Artifacts** 区域下载：\`${{ env.apk_name }}\`"
            echo ""
            echo "---"
            echo ""
            echo "- 类型：\`debug\`"
            echo "- 版本：\`v${{ env.version }}\`"
            echo "- 提交：\`${GITHUB_SHA::7}\`"
            echo "- 保留：30 天"
          } >> "$GITHUB_STEP_SUMMARY"
