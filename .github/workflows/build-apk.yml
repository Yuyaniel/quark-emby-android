# 手动构建 APK：仅在 Actions 页面点击 "Run workflow" 时触发，push/PR 不触发
name: 手动构建 APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: 构建 ${{ inputs.build_type }} APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 自动开启 Gradle 依赖缓存，二次构建明显提速
      - name: 设置 Gradle（含缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 读取版本号
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          echo "version=$VERSION" >> "$GITHUB_ENV"
          echo "版本号: $VERSION"

      - name: 构建 APK
        run: |
          chmod +x gradlew
          TYPE=$(echo "${{ inputs.build_type }}" | sed 's/^\(\.\)/\U\1/')
          ./gradlew "assemble$TYPE" --stacktrace

      # CI 环境没有 keystore.properties，release 产物为 app-release-unsigned.apk；
      # 用一次性生成的临时密钥现场签名，保证测试版可直接安装。
      # 注意：临时签名与本地正式签名不同，不能覆盖升级正式版。
      - name: 签名 release APK（临时密钥）
        if: inputs.build_type == 'release'
        run: |
          keytool -genkeypair -keystore ci.keystore -alias cikey \
            -keyalg RSA -keysize 2048 -validity 9999 \
            -storepass cipass -keypass cipass \
            -dname "CN=Ordify CI,O=Ordify,C=CN"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
          [ -f "$SRC" ] || SRC="app/build/outputs/apk/release/app-release.apk"
          "$BT/zipalign" -f 4 "$SRC" aligned.apk
          "$BT/apksigner" sign --ks ci.keystore --ks-pass pass:cipass \
            --key-pass pass:cipass --out signed.apk aligned.apk
          mv signed.apk app/build/outputs/apk/release/app-release.apk

      - name: 重命名 APK（应用名 + 版本 + 提交号）
        run: |
          TYPE="${{ inputs.build_type }}"
          SRC="app/build/outputs/apk/${TYPE}/app-${TYPE}.apk"
          DST="Ordify-v${{ env.version }}-${GITHUB_SHA::7}-${TYPE}.apk"
          mv "$SRC" "$DST"
          echo "apk_name=$DST" >> "$GITHUB_ENV"
          ls -lh "$DST"

      - name: 发布到 GitHub Releases（测试版）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TYPE="${{ inputs.build_type }}"
          APK="${{ env.apk_name }}"
          REL_NAME="Ordify-latest-${TYPE}.apk"
          cp "$APK" "$REL_NAME"
          TAG="ci-latest"
          TITLE="Ordify 测试版"
          NOTES="自动构建的 ${TYPE} 版 APK（commit ${GITHUB_SHA::7}，版本 v${{ env.version }}）。"

          # 如果 release 不存在则创建
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --prerelease

          # 上传/覆盖固定名称的 APK，保证下载链接稳定
          gh release upload "$TAG" "$REL_NAME" --repo "$GITHUB_REPOSITORY" --clobber

          echo "release_url=https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_ENV"

      - name: 上传为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.apk_name }}
          path: ${{ env.apk_name }}
          retention-days: 30

      - name: 构建摘要
        run: |
          {
            echo "## 构建完成"
            echo ""
            echo "### 📱 移动端直接下载"
            echo ""
            echo "**[⬇️ 点击下载 ${{ inputs.build_type }} APK](${{ env.release_url }})**"
            echo ""
            echo "---"
            echo ""
            echo "- 类型：\`${{ inputs.build_type }}\`"
            echo "- 版本：\`v${{ env.version }}\`"
            echo "- 提交：\`${GITHUB_SHA::7}\`"
            echo "- 固定文件名：\`Ordify-latest-${{ inputs.build_type }}.apk\`"
            echo "- Actions 产物：\`${{ env.apk_name }}\`（页面底部 Artifacts，保留 30 天）"
          } >> "$GITHUB_STEP_SUMMARY"
